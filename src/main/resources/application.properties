spring.application.name=GimnasioApi

# Base de datos H2 guardada en un archivo (carpeta ./data)
spring.datasource.url=jdbc:h2:file:./data/gimnasio
spring.datasource.username=sa
spring.datasource.password=

# Crea y actualiza las tablas automáticamente (cómodo para aprender)
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola el SQL que se ejecuta
spring.jpa.show-sql=true
spring.jpa.open-in-view=false