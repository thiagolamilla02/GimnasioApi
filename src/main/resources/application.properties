spring.application.name=GimnasioApi

# Base de datos H2 guardada en un archivo (carpeta ./data)
spring.datasource.url=jdbc:h2:file:./data/gimnasio
spring.datasource.username=sa
spring.datasource.password=

# Crea y actualiza las tablas automáticamente (cómodo para aprender)
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola el SQL que se ejecuta
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Subida de archivos (importacion de Excel)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Usuario inicial: solo se usa si todavia no existe ningun usuario.
# La clave NO se escribe aca: viene de la variable de entorno ADMIN_CLAVE.
app.admin.usuario=${ADMIN_USUARIO:admin}
app.admin.clave=${ADMIN_CLAVE:}

# Sesion
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax

# Con login, la consola de H2 queda bloqueada: mejor no dejarla habilitada
spring.h2.console.enabled=false