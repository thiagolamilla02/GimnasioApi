# Base de datos PostgreSQL: los datos de conexion vienen de variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CLAVE}
spring.datasource.hikari.maximum-pool-size=5

# Las tablas se crean y actualizan solas (suficiente para esta primera entrega)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Render asigna el puerto y pone HTTPS por delante: la aplicacion debe saberlo
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true