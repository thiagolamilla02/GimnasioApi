<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gimnasio - Socios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Gestión de socios</span>
    </div>
</nav>

<main class="container">

    <div id="mensaje-error" class="alert alert-danger d-none" role="alert"></div>

    <div class="row g-2 mb-3">
        <div class="col-12 col-md-6">
            <label for="buscar" class="form-label">Buscar</label>
            <input type="search" id="buscar" class="form-control form-control-lg"
                   placeholder="Apellido, nombre o DNI">
        </div>
        <div class="col-6 col-md-3">
            <label for="filtro" class="form-label">Mostrar</label>
            <select id="filtro" class="form-select form-select-lg">
                <option value="activos">Activos</option>
                <option value="deudores">Deudores</option>
                <option value="al-dia">Al día</option>
                <option value="bajas">De baja</option>
                <option value="todos">Todos</option>
            </select>
        </div>
        <div class="col-6 col-md-3">
            <label for="orden" class="form-label">Ordenar por</label>
            <select id="orden" class="form-select form-select-lg">
                <option value="apellido">Apellido</option>
                <option value="moroso-antiguo">Moroso más antiguo</option>
                <option value="moroso-reciente">Moroso más reciente</option>
            </select>
        </div>
    </div>

    <p id="contador" class="text-muted"></p>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Apellido y nombre</th>
                <th>DNI</th>
                <th>Teléfono</th>
                <th>Estado</th>
                <th>Último mes pagado</th>
            </tr>
            </thead>
            <tbody id="tabla-socios"></tbody>
        </table>
    </div>

    <p id="sin-resultados" class="text-center text-muted d-none">
        No hay socios que coincidan con la búsqueda.
    </p>

</main>

<script src="js/app.js"></script>
</body>
</html>
